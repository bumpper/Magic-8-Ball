    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s;
        }
        body.dark-mode {
            background-color: #1a1a1a;
        }
        .hidden-title {
		    display: none;
		}
        .magic-8-ball {
            width: 600px;
            height: 600px;
            background-image: url('magic8ball.png');
            background-size: cover;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .magic-8-ball::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 80px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.2) 40%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
        }
        body.dark-mode .magic-8-ball::after {
            display: none;
        }
        .message {
            width: 300px;
            height: 300px;
            background-color: #000000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 3px;
            text-align: center;
            opacity: 0;
            filter: blur(20px);
            transform: translateY(50px);
        }
        .message.show {
            animation: floatUp 2s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                font-size: 3px;
                filter: blur(20px);
                transform: translateY(50px);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                font-size: 28px;
                filter: blur(0px);
                transform: translateY(0);
                opacity: 1;
            }
        }
        .shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .toggle-switch {
            position: absolute;
            top: 20px;
            right: 90px;
            display: inline-block;
            width: 50px;
            height: 25px;
            background-color: #ccc;
            border-radius: 25px;
            cursor: pointer;
        }
        .toggle-switch::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 21px;
            height: 21px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.5s;
            z-index: 1;
        }
        .toggle-switch.active {
            background-color: #5555ff;
        }
        .toggle-switch.active::before {
            transform: translateX(25px);
        }
        .toggle-switch .mode-icon {
            position: absolute;
            top: 50%;
            z-index: 0;
            width: 12px;
            height: 12px;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .toggle-switch .sun { right: 6px; color: #ffd75e; }
        .toggle-switch .moon { left: 6px; color: #ffffff; }
        .toggle-switch:focus-visible { outline: 2px solid #5555ff; outline-offset: 2px; }
        .help-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            height: 25px;
            box-sizing: border-box;
            padding: 0 14px;
            margin: 0;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            transition: background-color 0.3s;
        }
        .help-btn:hover {
            background-color: #e0e0e0;
        }
        .dark-mode .help-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid #555;

<body>
<div class="hidden-title"><center><h1>Magic 8 Ball</h1></center></p></div>
    <div id="dark-mode-toggle" class="toggle-switch" role="switch" aria-checked="false" aria-label="Dark mode" tabindex="0">
        <svg class="mode-icon sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M8 1.4v1.4M8 13.2v1.4M1.4 8h1.4M13.2 8h1.4M3.1 3.1l1 1M11.9 11.9l1 1M12.9 3.1l-1 1M4.1 11.9l-1 1"/></g></svg>
        <svg class="mode-icon moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 9.7A5.7 5.7 0 0 1 6.3 2.6a5.8 5.8 0 1 0 7.1 7.1z" fill="currentColor"/></svg>
    </div>
    <a href="help.html" class="help-btn" title="Help Documentation" aria-label="Help Documentation">?</a>
    <div class="magic-8-ball" id="magic8Ball">
        <div class="message" id="message"></div>
    </div>

    <script>
		const magic8Ball = document.getElementById('magic8Ball');
		const messageElement = document.getElementById('message');
		const darkModeToggle = document.getElementById('dark-mode-toggle');
		const body = document.body;

		const messages = [
		    "It is certain",
		    "It is decidedly so",
		    "Without a doubt",
		    "Yes definitely",
		    "You may rely on it",
		    "As I see it, yes",
		    "Most likely",
		    "Outlook good",
		    "Yes",
		    "Signs point to yes",
		    "Reply hazy, try again",
		    "Ask again later",
		    "Better not tell you now",
		    "Cannot predict now",
		    "Concentrate and<br>ask again",
		    "Don't count on it",
		    "My reply is no",
		    "My sources say no",
		    "Outlook not so good",
		    "Very doubtful"
		];

		function getRandomMessage() {
		    return messages[Math.floor(Math.random() * messages.length)];
		}

		function shakeBall() {
		    shakeSound.play();
		    magic8Ball.classList.add('shake');
		    messageElement.classList.remove('show');
		    messageElement.style.opacity = 0;
		    
		    setTimeout(() => {
		        magic8Ball.classList.remove('shake');
		        messageElement.innerHTML = getRandomMessage();
		        messageElement.classList.add('show');
		    }, 500);
		}

		function applyToggleState(dark) {
		    body.classList.toggle('dark-mode', dark);
		    darkModeToggle.classList.toggle('active', dark);
		    darkModeToggle.setAttribute('aria-checked', dark ? 'true' : 'false');
		}

		darkModeToggle.addEventListener('click', () => {
		    const dark = !body.classList.contains('dark-mode');
		    applyToggleState(dark);
		    localStorage.setItem('darkMode', dark ? 'true' : 'false');
		});

		darkModeToggle.addEventListener('keydown', (e) => {
		    if (e.key === 'Enter' || e.key === ' ') {
		        e.preventDefault();
		        darkModeToggle.click();
		    }
		});

		magic8Ball.addEventListener('click', shakeBall);

		// Apply dark mode setting on page load
		applyToggleState(localStorage.getItem('darkMode') === 'true');
    </script>
<audio id="shakeSound" src="shake.wav" preload="auto" volume="0.1"></audio>
</body>
